<title>{{ site.meta_title }}</title>
<meta name="description" content="{{ site.meta_description }}">
<meta name="keywords" content="{{ site.meta_keywords }}">
<meta name="robots" content="{{ site.robots }}">
{% if site.site_url %}<link rel="canonical" href="{{ site.site_url }}">{% endif %}
{% if site.favicon %}<link rel="icon" href="{{ site.favicon }}">{% endif %}
{% if site.apple_touch_icon %}<link rel="apple-touch-icon" href="{{ site.apple_touch_icon }}">{% endif %}
<meta property="og:site_name" content="{{ site.site_name }}">
<meta property="og:title" content="{{ site.og_title }}">
<meta property="og:description" content="{{ site.og_description }}">
<meta property="og:type" content="{{ site.og_type }}">
{% if site.site_url %}<meta property="og:url" content="{{ site.site_url }}">{% endif %}
{% if site.og_image %}<meta property="og:image" content="{{ site.og_image }}"><meta property="og:image:alt" content="{{ site.og_image_alt }}">{% endif %}
<meta name="twitter:card" content="{{ site.twitter_card }}">
<meta name="twitter:site" content="{{ site.twitter_site }}">
<meta name="twitter:title" content="{{ site.twitter_title }}">
<meta name="twitter:description" content="{{ site.twitter_description }}">
{% if site.twitter_image %}<meta name="twitter:image" content="{{ site.twitter_image }}"><meta name="twitter:image:alt" content="{{ site.twitter_image_alt }}">{% endif %}
