<details>
  <summary>{{ copy.edit_image }}</summary>
  {% if value %}<p><img src="{{ value.url }}" alt="{{ copy.image_preview }}" width="200"></p>{% endif %}
  <p>{{ copy.image_saved_later }}</p>
  <p><label><input type="checkbox" name="{{ name }}__enable_edits"> {{ copy.image_enable_edits }}</label></p>
  <p>{{ copy.image_crop_help }}</p>
  <p>
    <label>{{ copy.image_x }} <input class="vIntegerField" type="number" name="{{ name }}__crop_x" value="0" min="0" max="99" step="0.1"></label>
    <label>{{ copy.image_y }} <input class="vIntegerField" type="number" name="{{ name }}__crop_y" value="0" min="0" max="99" step="0.1"></label>
    <label>{{ copy.image_width }} <input class="vIntegerField" type="number" name="{{ name }}__crop_width" value="100" min="0.1" max="100" step="0.1"></label>
    <label>{{ copy.image_height }} <input class="vIntegerField" type="number" name="{{ name }}__crop_height" value="100" min="0.1" max="100" step="0.1"></label>
  </p>
  <p><label>{{ copy.image_rotate }} <select name="{{ name }}__rotate"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label></p>
  <p><label><input type="checkbox" name="{{ name }}__flip_horizontal"> {{ copy.image_flip_horizontal }}</label> <label><input type="checkbox" name="{{ name }}__flip_vertical"> {{ copy.image_flip_vertical }}</label></p>
  <p><label>{{ copy.image_brightness }} <input class="vIntegerField" type="number" name="{{ name }}__brightness" value="1" min="0.5" max="1.5" step="0.05"></label> <label>{{ copy.image_contrast }} <input class="vIntegerField" type="number" name="{{ name }}__contrast" value="1" min="0.5" max="1.5" step="0.05"></label></p>
  <p><label>{{ copy.image_resize }} <input class="vIntegerField" type="number" name="{{ name }}__resize_width" value="0" min="0" max="{{ max_edge }}"></label></p>
  <p>{{ copy.image_resize_help }}</p>
</details>
